name: Release

# Push a tag like v1.0.0 to build, sign, notarize and publish Blink to GitHub Releases.
#
# Repository secrets:
#   DEVELOPER_ID_P12_BASE64   Developer ID Application certificate and key, exported as .p12, base64-encoded
#   DEVELOPER_ID_P12_PASSWORD Password of that .p12
#   DEVELOPER_ID_APPLICATION  Identity name, e.g. "Developer ID Application: Jane Doe (TEAMID1234)"
#   TEAM_ID                   Apple Developer team ID
#   NOTARY_APPLE_ID           Apple ID used for notarization
#   NOTARY_PASSWORD           App-specific password for that Apple ID

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $version"; exit 1; }

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Store notarization credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcrun notarytool store-credentials blink-notary \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD" \
            --keychain "$RUNNER_TEMP/signing.keychain-db"

      - name: Build, sign, notarize and package
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARY_PROFILE: blink-notary
          NOTARY_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          CODESIGN_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
        run: scripts/release.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" \
            "dist/Blink-$version.dmg" "dist/Blink-$version.zip" dist/SHA256SUMS.txt \
            --title "Blink $version" --notes-file "docs/releases/$version.md"

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
