name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Check the generated project is up to date
        if: matrix.runner == 'macos-15'
        env:
          XCODEGEN_VERSION: "2.46.0"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
          git diff --exit-code -- Blink.xcodeproj

      - name: Core tests
        run: swift test --package-path Packages/BlinkCore

      - name: Build app (Release, universal, unsigned)
        run: |
          xcodebuild -project Blink.xcodeproj -scheme Blink -configuration Release \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
          archs=$(lipo -archs build/DerivedData/Build/Products/Release/Blink.app/Contents/MacOS/Blink)
          echo "$archs"
          for arch in arm64 x86_64; do
            case " $archs " in *" $arch "*) ;; *) echo "Missing $arch slice"; exit 1 ;; esac
          done

      - name: Package like a release (ad-hoc signed, not notarized)
        if: matrix.runner == 'macos-15'
        env:
          DEVELOPER_ID_APPLICATION: "-"
          SKIP_NOTARIZATION: "1"
        run: scripts/release.sh

      - name: Upload the packaged build
        if: matrix.runner == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: blink-dmg
          path: dist/
          retention-days: 14
