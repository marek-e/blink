name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Check the generated project is up to date
        if: matrix.runner == 'macos-15'
        env:
          XCODEGEN_VERSION: "2.46.0"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
          git diff --exit-code -- Blink.xcodeproj

      - name: Core tests
        run: swift test --package-path Packages/BlinkCore

      - name: Build app (Release, universal, unsigned)
        run: |
          xcodebuild -project Blink.xcodeproj -scheme Blink -configuration Release \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
          lipo -archs build/DerivedData/Build/Products/Release/Blink.app/Contents/MacOS/Blink
